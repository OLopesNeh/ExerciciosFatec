<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Classe de cores no Bootstrap</title>
    <!--Importação CSS BootStrap-->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <h1>Cores no Bootstrap</h1>

    <p class="text-muted">Muted</p>
    <p class="text-primary">Primary</p>
    <p class="text-success">success</p>
    <p class="text-info">info</p>
    <p class="text-warning">warning</p>
    <p class="text-danger">danger</p>
    <p class="text-secondary">secondary</p>
    <p class="text-dark">dark</p>
    <p class="text-light bg-success">light</p>
    <!--Aplicando 50% de opacidade no texto branco fundo vermelho-->
    <p class="text-white-50 bg-danger">light</p>

    <hr>

    <h1>Botões no Bootstrap</h1>
    <button type="button" class="btn">Primário</button><br><br>
    <button type="button" class="btn btn-primary">Secundário</button><br><br>
    <button type="button" class="btn btn-success">Sucesso</button><br><br>
    <button type="button" class="btn btn-info">Info</button><br><br>
    <button type="button" class="btn btn-warning">alerta</button><br><br>
    <button type="button" class="btn btn-danger">Erro</button><br><br>
    <button type="button" class="btn btn-dark">Escuro</button><br><br>
    <button type="button" class="btn btn-light">Claro</button><br><br>

    <!--Importação do Javascript do Bootstrap-->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
      integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
